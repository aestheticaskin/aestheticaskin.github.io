    <div class="reveal"><span class="text-eyebrow" style="display:block;margin-bottom:0.75rem;">About the Treatment</span><h2 class="text-headline-lg text-primary" style="margin-bottom:1.25rem;">What is a Clinical Facial?</h2>
      <p class="text-body-lg text-muted" style="margin-bottom:1rem;line-height:1.8;">A clinical facial is a medically supervised skin treatment that goes far beyond a standard beauty salon facial. It uses pharmaceutical-grade products, medical-grade equipment, and clinically validated protocols designed to treat specific skin conditions — not just provide temporary relaxation.</p>
      <p class="text-body-md text-muted" style="margin-bottom:1.5rem;line-height:1.8;">At Aesthetica, every clinical facial is preceded by a skin analysis by Dr. Prachi Gupta Garg. The treatment is then customised with the right combination of cleansing, exfoliation, extractions, masks, serums, and LED therapy suited to your exact skin type and concern.</p>
      <div style="display:flex;flex-wrap:wrap;gap:0.75rem;"><span style="padding:0.4rem 1rem;border:1px solid var(--color-outline-variant);border-radius:999px;font-size:13px;color:var(--color-on-surface-variant);">HydraFacial</span><span style="padding:0.4rem 1rem;border:1px solid var(--color-outline-variant);border-radius:999px;font-size:13px;color:var(--color-on-surface-variant);">LED Therapy</span><span style="padding:0.4rem 1rem;border:1px solid var(--color-outline-variant);border-radius:999px;font-size:13px;color:var(--color-on-surface-variant);">Oxygen Facial</span><span style="padding:0.4rem 1rem;border:1px solid var(--color-outline-variant);border-radius:999px;font-size:13px;color:var(--color-on-surface-variant);">Anti-Aging Facial</span></div>
    </div>
    <div class="reveal reveal-delay-2" style="background:var(--color-surface-container-low);border-radius:var(--radius-lg);padding:2.5rem;border:1px solid var(--color-outline-variant);">
      <h3 class="text-headline-md text-primary" style="margin-bottom:1.5rem;">Conditions We Treat</h3>
      <ul style="display:flex;flex-direction:column;gap:1rem;"><li style="display:flex;align-items:flex-start;gap:0.75rem;"><span class="material-symbols-outlined text-secondary" style="margin-top:2px;font-size:18px;">check_circle</span><div><strong style="color:var(--color-primary);">Congested, clogged pores</strong><br/><span class="text-muted" style="font-size:14px;">Deep cleansing extractions clear blackheads and whiteheads safely.</span></div></li><li style="display:flex;align-items:flex-start;gap:0.75rem;"><span class="material-symbols-outlined text-secondary" style="margin-top:2px;font-size:18px;">check_circle</span><div><strong style="color:var(--color-primary);">Dull & dehydrated skin</strong><br/><span class="text-muted" style="font-size:14px;">Intensive hydration serums restore plumpness and radiance instantly.</span></div></li><li style="display:flex;align-items:flex-start;gap:0.75rem;"><span class="material-symbols-outlined text-secondary" style="margin-top:2px;font-size:18px;">check_circle</span><div><strong style="color:var(--color-primary);">Oily & acne-prone skin</strong><br/><span class="text-muted" style="font-size:14px;">Salicylic-based protocols regulate sebum and reduce breakouts.</span></div></li><li style="display:flex;align-items:flex-start;gap:0.75rem;"><span class="material-symbols-outlined text-secondary" style="margin-top:2px;font-size:18px;">check_circle</span><div><strong style="color:var(--color-primary);">Aging & fine lines</strong><br/><span class="text-muted" style="font-size:14px;">Peptide and retinol-based facials stimulate collagen for firmer skin.</span></div></li><li style="display:flex;align-items:flex-start;gap:0.75rem;"><span class="material-symbols-outlined text-secondary" style="margin-top:2px;font-size:18px;">check_circle</span><div><strong style="color:var(--color-primary);">Sensitive & reactive skin</strong><br/><span class="text-muted" style="font-size:14px;">Calming clinical protocols reduce redness and strengthen the skin barrier.</span></div></li></ul>

    <div class="reveal"><span class="text-eyebrow" style="display:block;margin-bottom:0.75rem;">Common Questions</span><h2 class="text-headline-lg text-primary" style="margin-bottom:1rem;">Clinical Facial Treatment in Punawale, Pune — FAQ</h2><p class="text-body-md text-muted">Answers to the most common questions about this treatment at Aesthetica, Punawale, Pune.</p></div>
    <div class="accordion-group reveal reveal-delay-1"><div class="accordion-item"><button class="accordion-trigger" aria-expanded="false"><h4>What is the difference between a clinical facial and a salon facial?</h4><span class="material-symbols-outlined accordion-icon">expand_more</span></button><div class="accordion-body"><p>A clinical facial is performed or supervised by a medical professional and uses pharmaceutical-grade products with clinically proven actives at therapeutic concentrations. Salon facials use cosmetic-grade products and are primarily relaxing rather than corrective.</p></div></div><div class="accordion-item"><button class="accordion-trigger" aria-expanded="false"><h4>How often should I get a clinical facial?</h4><span class="material-symbols-outlined accordion-icon">expand_more</span></button><div class="accordion-body"><p>For maintenance and glowing skin, monthly sessions are recommended. For specific concerns like acne or pigmentation, a series of 4–6 sessions every 2–3 weeks is more appropriate, followed by monthly maintenance.</p></div></div><div class="accordion-item"><button class="accordion-trigger" aria-expanded="false"><h4>Is there downtime after a clinical facial?</h4><span class="material-symbols-outlined accordion-icon">expand_more</span></button><div class="accordion-body"><p>Most clinical facials have little to no downtime. Mild redness for a few hours post-treatment is normal. Avoid sun exposure and makeup for 24 hours. You can return to normal activities the same day.</p></div></div><div class="accordion-item"><button class="accordion-trigger" aria-expanded="false"><h4>Which facial is best for my skin type?</h4><span class="material-symbols-outlined accordion-icon">expand_more</span></button><div class="accordion-body"><p>Dr. Prachi will assess your skin at the consultation and recommend the right protocol. HydraFacials are great for hydration, LED therapy for anti-aging, oxygen facials for brightness, and salicylic protocols for acne-prone skin.</p></div></div></div>
  </div></div></section>
